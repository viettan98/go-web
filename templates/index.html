<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoBook - Book Purchase & Review System</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .book-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr) !important;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 900px) {
            .book-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="nav-brand">📚 GoBook</a>
        
        <div class="nav-search">
            <input type="text" id="searchInput" placeholder="Search books, authors...">
            <button onclick="searchBooks()">🔍</button>
        </div>

        <div class="nav-links">
            <a href="/catalog">Catalog</a>
            <a href="/authors">Authors</a>
            <a href="/login" class="btn-auth">Login / Register</a>
        </div>
    </nav>

    <div class="hero-banner">
        <h1>Discover an Endless World of Books</h1>
        <p>Buy books online easily.</p>
        <button style="background: #1abc9c; color: white; border: none; padding: 10px 25px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer;" onclick="scrollToCatalog()">Explore Now</button>
    </div>

    <div class="container" id="catalogSection">
        <h2>🔥 New & Recommended Books For You</h2>
        
        <div id="bookGrid" class="book-grid">
            <p style="color: #7f8c8d;">Loading book catalog...</p>
        </div>

        <div id="paginationContainer" class="pagination-container"></div>
    </div>

    <footer>
    </footer>

    <script>
        let allBooks = [];
        const itemsPerPage = 8;
        let currentPage = 1;

        // fetchBooks
        async function fetchBooks() {
            try {
                const res = await fetch('/api/books');
                const data = await res.json();
                allBooks = data.books || [];
                
                if (allBooks.length === 0) {
                    document.getElementById('bookGrid').innerHTML = '<p style="color: #7f8c8d;">No books available in inventory.</p>';
                    document.getElementById('paginationContainer').innerHTML = '';
                    return;
                }

                renderPage(currentPage);
            } catch (err) {
                console.error("Error loading books", err);
            }
        }

        // renderPage
        function renderPage(page) {
            currentPage = page;
            const grid = document.getElementById('bookGrid');
            grid.innerHTML = '';

            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageBooks = allBooks.slice(start, end);

            pageBooks.forEach(async (book) => {
                const card = document.createElement('div');
                card.className = 'book-card';

                card.onclick = (e) => {
                    if (e.target.closest('button')) return;
                    window.location.href = `/book/${book.id}`;
                };
                
                const coverImg = book.image_url || 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?auto=format&fit=crop&w=400&q=80';
                const category = book.category || 'Programming & Tech';

                card.innerHTML = `
                    <div class="book-img-container">
                        <img src="${coverImg}" alt="${book.title}">
                    </div>
                    <div class="book-info">
                        <div class="book-category">${category}</div>
                        <h3 class="book-title">${book.title}</h3>
                        <div class="book-rating" id="rating-${book.id}">
                            ★★★★★ <span>(0 reviews)</span>
                        </div>
                        <div class="book-card-footer">
                            <span class="book-price">$${book.price}</span>
                            <button class="btn-cart" onclick="quickAddToCart('${book.id}', '${book.title.replace(/'/g, "\\'")}', ${book.price}, event)" title="Add to cart">
                                🛒
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);

                try {
                    const revRes = await fetch(`/api/reviews/${book.id}`);
                    const revData = await revRes.json();
                    const reviews = revData.reviews || [];
                    
                    const ratingContainer = document.getElementById(`rating-${book.id}`);
                    if (ratingContainer) {
                        if (reviews.length > 0) {
                            const sum = reviews.reduce((acc, r) => acc + r.rating, 0);
                            const avg = (sum / reviews.length).toFixed(1);
                            const filledStars = Math.round(sum / reviews.length);
                            const stars = '★'.repeat(filledStars) + '☆'.repeat(5 - filledStars);
                            ratingContainer.innerHTML = `${stars} <span style="font-weight:bold; color:#e67e22;">${avg}</span> <span>(${reviews.length})</span>`;
                        } else {
                            ratingContainer.innerHTML = `★★★★★ <span>(0)</span>`;
                        }
                    }
                } catch (e) {
                    console.error("Could not load reviews for book", book.id);
                }
            });

            renderPagination();
        }

        // renderPagination
        function renderPagination() {
            const paginationContainer = document.getElementById('paginationContainer');
            paginationContainer.innerHTML = '';

            const totalPages = Math.ceil(allBooks.length / itemsPerPage);
            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.innerText = '« Previous';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => renderPage(currentPage - 1);
            paginationContainer.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => renderPage(i);
                paginationContainer.appendChild(btn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.innerText = 'Next »';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => renderPage(currentPage + 1);
            paginationContainer.appendChild(nextBtn);
        }

        // searchBooks
        function searchBooks() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            if (!keyword) {
                allBooks = originalBooks;
            } else {
                allBooks = allBooks.filter(b => b.title.toLowerCase().includes(keyword) || b.author.toLowerCase().includes(keyword));
            }
            renderPage(1);
        }

        // scrollToCatalog
        function scrollToCatalog() {
            document.getElementById('catalogSection').scrollIntoView({ behavior: 'smooth' });
        }

        let originalBooks = [];
        // init
        async function init() {
            const res = await fetch('/api/books');
            const data = await res.json();
            allBooks = data.books || [];
            originalBooks = [...allBooks];
            renderPage(1);
        }

        // setupNavbarAuth
        async function setupNavbarAuth() {
            const currentUser = localStorage.getItem("goBookUser");
            const linksContainers = document.querySelectorAll(".nav-links");

            linksContainers.forEach(container => {
                const authBtn = container.querySelector(".btn-auth");
                if (authBtn) authBtn.remove();

                if (currentUser) {
                    const userCartDiv = document.createElement("div");
                    userCartDiv.className = "user-cart-area";
                    userCartDiv.style.display = "flex";
                    userCartDiv.style.alignItems = "center";
                    userCartDiv.style.gap = "15px";
                    userCartDiv.innerHTML = `
                        <div class="cart-wrapper">
                            <button class="cart-icon-btn" id="cartToggleBtn" title="Cart">
                                🛒 <span id="cartBadge" class="cart-badge">0</span>
                            </button>
                            <div class="cart-modal" id="cartModalBox">
                                <h4 style="margin-top:0; border-bottom:1px solid #eee; padding-bottom:8px; color:#2c3e50;">Temporary Cart</h4>
                                <div id="cartItemList" style="max-height: 220px; overflow-y: auto;">
                                    <p style="color: #7f8c8d; font-size: 0.9rem; text-align: center;">Cart is empty</p>
                                </div>
                                <a href="/checkout" class="btn-checkout">Proceed to Checkout</a>
                            </div>
                        </div>
                        <a href="/profile" class="user-icon-btn" title="Profile">${currentUser.charAt(0).toUpperCase()}</a>
                    `;
                    container.appendChild(userCartDiv);
                    
                    const cartToggleBtn = document.getElementById("cartToggleBtn");
                    const cartModalBox = document.getElementById("cartModalBox");

                    cartToggleBtn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        cartModalBox.classList.toggle("show");
                    });

                    window.addEventListener("click", (e) => {
                        if (!cartModalBox.contains(e.target) && !cartToggleBtn.contains(e.target)) {
                            cartModalBox.classList.remove("show");
                        }
                    });

                    loadUserCart(currentUser);
                } else {
                    const loginA = document.createElement("a");
                    loginA.href = "/login";
                    loginA.className = "btn-auth";
                    loginA.innerText = "Login / Register";
                    container.appendChild(loginA);
                }
            });
        }

        // loadUserCart
        async function loadUserCart(username) {
            try {
                const res = await fetch(`/api/cart/${username}`);
                const data = await res.json();
                const cart = data.cart || [];
                
                const badge = document.getElementById("cartBadge");
                if (badge) badge.innerText = cart.length;

                const itemList = document.getElementById("cartItemList");
                if (itemList) {
                    if (cart.length > 0) {
                        itemList.innerHTML = "";
                        cart.forEach(item => {
                            const row = document.createElement("div");
                            row.className = "cart-item-row";
                            row.innerHTML = `
                                <div class="cart-item-info" title="${item.title}">
                                    <b>${item.title}</b> (x${item.quantity})<br>
                                    <span style="color:#e74c3c; font-size: 0.85rem;">$${item.price * item.quantity}</span>
                                </div>
                                <button class="btn-remove-item" onclick="removeCartItem('${username}', '${item.book_id}')" title="Remove book">🗑️</button>
                            `;
                            itemList.appendChild(row);
                        });
                    } else {
                        itemList.innerHTML = '<p style="color: #7f8c8d; font-size: 0.9rem; text-align: center;">Cart is empty</p>';
                    }
                }
            } catch (e) {
                console.error("Error loading cart", e);
            }
        }

        // removeCartItem
        async function removeCartItem(username, bookId) {
            try {
                const res = await fetch('/api/cart/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, book_id: bookId })
                });

                if (res.ok) {
                    loadUserCart(username);
                } else {
                    alert("Could not remove item from cart.");
                }
            } catch (err) {
                console.error("Error removing from cart:", err);
            }
        }

        // quickAddToCart
        async function quickAddToCart(bookId, title, price, event) {
            if (event) event.stopPropagation();

            const currentUser = localStorage.getItem("goBookUser");
            if (!currentUser) {
                alert("Please log in to add books to your cart!");
                window.location.href = "/login";
                return;
            }

            try {
                const res = await fetch('/api/cart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: currentUser,
                        book_id: bookId,
                        title: title,
                        price: price,
                        quantity: 1
                    })
                });

                if (res.ok) {
                    alert(`Added book "${title}" to cart successfully!`);
                    loadUserCart(currentUser);
                } else {
                    alert("Could not add to cart.");
                }
            } catch (err) {
                console.error("Error adding to cart:", err);
            }
        }

        window.addEventListener("DOMContentLoaded", setupNavbarAuth);

        init();
    </script>
</body>
</html>
